name: Build Android Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Step 1: Checkout repository with submodules (mermaid, katex)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Step 2: Set up Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      # Step 4: Cache pub dependencies and Gradle
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Step 5: Install dependencies & run build_runner code generation
      - name: Install dependencies
        run: flutter pub get

      - name: Generate code in workspace
        shell: bash
        run: |
          for dir in . packages/* apps/*; do
            if [ -f "$dir/pubspec.yaml" ] && grep -q '^  build_runner:' "$dir/pubspec.yaml"; then
              echo "::group::build_runner in $dir"
              (cd "$dir" && dart run build_runner build --delete-conflicting-outputs)
              echo "::endgroup::"
            fi
          done

      - name: Configure Android signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEY_PROPERTIES_BASE64 != ''
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES_BASE64: ${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/conduit-keystore.jks
          echo "$ANDROID_KEY_PROPERTIES_BASE64" | base64 --decode > key.properties

      - name: Run LobeHub tests
        run: |
          (cd packages/conduit_core && dart test \
            test/features/lobehub \
            test/services/api_service_chat_completion_test.dart \
            test/services/api_service_user_files_test.dart \
            test/services/openwebui_stream_parser_test.dart \
            test/services/lobehub_file_upload_test.dart \
            test/services/lobehub_file_details_test.dart \
            test/services/lobehub_backend_dispatch_test.dart \
            test/services/api_service_lobehub_models_test.dart \
            test/services/lobehub_chat_transport_test.dart \
            test/services/lobehub_chat_persistence_test.dart \
            test/database/mappers/lobehub_conversation_metadata_test.dart \
            test/database/daos/messages_dao_test.dart \
            test/sync/outbox_drainer_test.dart \
            test/services/lobehub_execution_boundary_test.dart \
            test/services/lobehub_topic_identity_test.dart \
            test/sync/lobehub_durable_turn_test.dart \
            test/database/daos/chats_dao_outbox_test.dart \
            test/database/daos/lobehub_transcript_branch_test.dart \
            test/services/streaming_response_controller_test.dart)
          flutter test \
            test/features/lobehub \
            test/features/auth/lobehub_connection_page_test.dart \
            test/features/navigation/main_navigation_shell_test.dart \
            test/shared/widgets/markdown/renderer/lobe_reasoning_widget_test.dart \
            test/integration/lobehub_e2e_test.dart \
            test/features/chat/services/request_completion_runner_test.dart \
            test/features/chat/services/lobehub_submission_test.dart \
            test/features/chat/services/lobehub_production_turn_test.dart \
            test/core/providers/lobehub_socket_isolation_test.dart \
            test/core/providers/socket_service_manager_test.dart \
            test/core/utils/lobehub_model_icon_test.dart \
            test/features/chat/services/lobehub_request_history_test.dart \
            test/features/chat/services/lobehub_durable_identity_test.dart \
            test/features/chat/providers/chat_openwebui_alignment_test.dart \
            test/core/services/streaming_helper_transport_test.dart \
            test/features/chat/providers/chat_openwebui_transport_ownership_test.dart \
            test/features/chat/providers/queued_completion_provider_test.dart

      # Step 7: Build release APK (universal and split-per-abi)
      - name: Build APK (Release & Split-per-ABI)
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      # Step 8: Upload artifacts
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # Step 9: Create GitHub Release on version tags
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
